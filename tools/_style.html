<style>
  :root{
    color-scheme: light dark;
    --ink:#0b0b0c; --muted:#66666e; --brand:#d2643c; --brand-deep:#b9502b;
    --paper:#f7f7f9; --card:rgba(255,255,255,.9); --line:#e6e6ea; --shadow:0 18px 44px -28px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#f2f2f4; --muted:#a0a0aa; --brand:#e4794f; --brand-deep:#e4794f;
      --paper:#0d0d10; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10); --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--paper),transparent 55%),var(--paper);-webkit-font-smoothing:antialiased}
  main{max-width:960px;margin:0 auto;padding:0 20px 72px}
  a{color:var(--brand-deep)}
  .hero{padding:64px 0 8px;text-align:center}
  .hero img.icon{width:92px;height:92px;border-radius:21px;box-shadow:var(--shadow)}
  h1{margin:22px 0 10px;font-size:clamp(34px,6.5vw,54px);line-height:1.06;letter-spacing:-.02em}
  .tagline{color:var(--muted);margin:0 auto 30px;max-width:34em;font-size:clamp(17px,2.4vw,20px)}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;text-decoration:none;
    font-weight:600;padding:15px 28px;border-radius:999px;box-shadow:var(--shadow)}
  .cta:hover{background:var(--brand-deep)}
  .meta{margin-top:14px;color:var(--muted);font-size:14px}
  .shots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:52px 0 8px}
  .shots img{width:100%;border-radius:18px;border:1px solid var(--line);background:var(--card)}
  @media (max-width:760px){ .shots{grid-template-columns:repeat(2,1fr)} }
  h2{font-size:clamp(24px,3.4vw,30px);letter-spacing:-.01em;margin:56px 0 6px}
  .lede{color:var(--muted);margin:0 0 26px;max-width:44em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:760px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
  .card h3{margin:0 0 8px;font-size:18px}
  .card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}
  table{width:100%;border-collapse:collapse;margin-top:22px;font-size:15.5px}
  th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  td.yes{color:var(--brand-deep);font-weight:600}
  .band{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 28px;margin-top:56px}
  .band p{color:var(--muted);margin:8px 0 0}
  .apps{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .apps a{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:999px;
    text-decoration:none;color:var(--ink);font-size:15px;background:var(--card)}
  footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
  footer a{margin-right:18px}
</style>
